
<div class="forgot-page">
  <div class="forgot-card">

    <a routerLink="/login" class="back-link">
      <i class="bi bi-arrow-left"></i>
      Back to Login
    </a>

    <div class="forgot-icon">
      <i class="bi bi-shield-lock"></i>
    </div>

    <h2>Forgot Password?</h2>

    <p class="subtitle">
      Reset your TrainBook account password securely.
    </p>

    <div *ngIf="message" class="alert success-alert" role="status">
      <i class="bi bi-check-circle-fill"></i>
      {{ message }}
    </div>

    <div *ngIf="errorMessage" class="alert error-alert" role="alert">
      <i class="bi bi-exclamation-circle-fill"></i>
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="otpSent ? resetPassword() : sendOtp()">

      <div class="form-group">
        <label for="mobile">Registered Mobile Number</label>

        <div class="input-wrapper">
          <i class="bi bi-phone"></i>

          <input
            id="mobile"
            type="tel"
            name="mobile"
            [(ngModel)]="mobile"
            placeholder="Enter 10-digit mobile number"
            maxlength="10"
            inputmode="numeric"
            pattern="[0-9]{10}"
            autocomplete="tel"
            [readonly]="otpSent"
            required
          />
        </div>
      </div>

      <button
        *ngIf="!otpSent"
        type="button"
        class="primary-btn"
        (click)="sendOtp()"
        [disabled]="loading"
      >
        <span *ngIf="!loading">
          <i class="bi bi-send"></i> Send OTP
        </span>

        <span *ngIf="loading">
          <span class="spinner"></span> Sending OTP...
        </span>
      </button>

      <ng-container *ngIf="otpSent">

        <div class="form-group">
          <label for="otp">Enter OTP</label>

          <div class="input-wrapper">
            <i class="bi bi-key"></i>

            <input
              id="otp"
              type="text"
              name="otp"
              [(ngModel)]="otp"
              placeholder="Enter 6-digit OTP"
              maxlength="6"
              inputmode="numeric"
              pattern="[0-9]{6}"
              autocomplete="one-time-code"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>

          <div class="input-wrapper">
            <i class="bi bi-lock"></i>

            <input
              id="newPassword"
              type="password"
              name="newPassword"
              [(ngModel)]="newPassword"
              placeholder="Enter new password"
              minlength="6"
              maxlength="72"
              autocomplete="new-password"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>

          <div class="input-wrapper">
            <i class="bi bi-lock-fill"></i>

            <input
              id="confirmPassword"
              type="password"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              placeholder="Confirm new password"
              minlength="6"
              maxlength="72"
              autocomplete="new-password"
              required
            />
          </div>
        </div>

        <button
          type="submit"
          class="primary-btn"
          [disabled]="loading"
        >
          <span *ngIf="!loading">
            <i class="bi bi-shield-check"></i> Reset Password
          </span>

          <span *ngIf="loading">
            <span class="spinner"></span> Resetting Password...
          </span>
        </button>

        <button
          type="button"
          class="resend-btn"
          (click)="sendOtp()"
          [disabled]="loading"
        >
          <i class="bi bi-arrow-clockwise"></i>
          Resend OTP
        </button>

      </ng-container>

    </form>

    <div class="security-note">
      <i class="bi bi-shield-check"></i>
      Your account security matters to us.
    </div>

  </div>
</div>
